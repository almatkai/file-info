[package]
name = "tezbar-file-info"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Standalone File Info commands for Tezbar protocol 1"

[workspace]
resolver = "3"

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "io-util", "process", "time", "sync"] }
uuid = { version = "=1.23.3", features = ["v4"] }
sha2 = "=0.10.9"
crc32fast = "=1.5.0"
chrono = { version = "=0.4.42", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
url = "=2.5.4"
